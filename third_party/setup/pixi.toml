[project]
name        = "g1_io_env"
version     = "0.1.0"
description = "G1 IO full environment — ROS2 Humble + unitree_sdk2 + Python stack"
channels    = ["robostack-humble", "conda-forge"]
platforms   = ["linux-64"]

# ── Runtime dependencies ───────────────────────────────────────────────────
[dependencies]
# ROS2 Humble core
ros-humble-desktop                      = "*"
ros-humble-rclcpp                       = "*"
ros-humble-rclpy                        = "*"
ros-humble-std-msgs                     = "*"
ros-humble-sensor-msgs                  = "*"
ros-humble-geometry-msgs                = "*"
ros-humble-nav-msgs                     = "*"
ros-humble-tf2                          = "*"
ros-humble-tf2-ros                      = "*"
ros-humble-tf2-geometry-msgs            = "*"
ros-humble-robot-state-publisher        = "*"
ros-humble-joint-state-publisher-gui    = "*"
ros-humble-rviz2                        = "*"
ros-humble-foxglove-bridge              = "*"
ros-humble-rosbag2                      = "*"
ros-humble-rosbag2-storage-default      = "*"

# Build tools
cmake                       = ">=3.16"
colcon-common-extensions    = "*"
ament-cmake                 = "*"
ament-cmake-python          = "*"
ninja                       = "*"

# Python policy stack
python          = "3.10.*"
numpy           = ">=1.24"
scipy           = ">=1.10"
pyyaml          = ">=6.0"
onnxruntime     = ">=1.16"       # swap for onnxruntime-gpu on Jetson
numpy-quaternion = "*"

# RealSense Python bindings (fallback — prefer apt librealsense2-dev for C++ node)
pyrealsense2    = ">=2.54"

[build-dependencies]
ros-humble-rosidl-default-generators   = "*"
ros-humble-rosidl-default-runtime      = "*"

# ── unitree_sdk2 notes ─────────────────────────────────────────────────────
# unitree_sdk2 is a pre-built C++ static library (ships with CycloneDDS).
# It cannot be installed via conda — clone it into ../unitree_sdk2/ and let
# CMakeLists.txt link against it using the bundled lib/ and thirdparty/ paths.
# The pixi shell provides cmake / colcon; the SDK itself is in third_party.

# ── Tasks ──────────────────────────────────────────────────────────────────
[tasks]

# Build the whole g1_io workspace (run from repo root)
build = { cmd = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release", cwd = "../.." }

# Source workspace (paste into your shell after build)
source = "echo 'Run: source ../../install/setup.bash'"

# ── Run targets ─────────────────────────────────────────────────────────────
run_real          = "ros2 run g1_io cpp_middleware --targets real"
run_isaac         = "ros2 run g1_io cpp_middleware --targets isaac"
run_mujoco        = "ros2 run g1_io cpp_middleware --targets mujoco"
run_real_isaac    = "ros2 run g1_io cpp_middleware --targets real isaac"
run_real_mujoco   = "ros2 run g1_io cpp_middleware --targets real mujoco"
run_isaac_mujoco  = "ros2 run g1_io cpp_middleware --targets isaac mujoco"

# Adapters
adapter_isaac  = "ros2 run g1_io isaaclab_adapter"
adapter_mujoco = "ros2 run g1_io mujoco_adapter"

# Extras
realsense = "ros2 run g1_io realsense_node"
foxglove  = "ros2 launch g1_io foxglove.launch.py"

# ── GPU feature (swap onnxruntime for GPU version) ─────────────────────────
[feature.gpu.dependencies]
onnxruntime-gpu = ">=1.16"
